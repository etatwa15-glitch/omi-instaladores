name: Publish OMI 0.1.19 for Windows

on:
  push:
    paths:
      - 'build-input/OMI-windows-0.1.19.zip'
      - '.github/workflows/publish-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-0.1.19
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify and unpack compiled application
        shell: pwsh
        run: |
          $archive = 'build-input/OMI-windows-0.1.19.zip'
          $expected = ((Get-Content 'build-input/OMI-windows-0.1.19.sha256' -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ine $expected) { throw 'Build input hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath app
          [IO.File]::WriteAllText((Join-Path $PWD 'app/package.json'), (Get-Content 'app/package.json' -Raw).TrimStart([char]0xFEFF), [Text.UTF8Encoding]::new($false))
          if ((Get-Content app/package.json -Raw | ConvertFrom-Json).version -ne '0.1.19') { throw 'Unexpected app version' }
          if ((Get-FileHash app/dist/omi-logo.png -Algorithm SHA256).Hash -ine '1957e92a72047c8dca823f459d52edb120b346fa640465bc6d35342015d74321') { throw 'App does not contain the exact approved logo' }

      - name: Install build tools
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build installer and update package
        working-directory: app
        run: npx electron-forge make --platform win32 --arch x64

      - name: Verify update artifacts
        shell: pwsh
        run: |
          $releaseDir = 'app/out-omi/make/squirrel.windows/x64'
          $package = Get-Item "$releaseDir/OMI-0.1.19-full.nupkg"
          $entry = (Get-Content "$releaseDir/RELEASES" -Raw).Trim()
          $expected = '{0} {1} {2}' -f (Get-FileHash $package.FullName -Algorithm SHA1).Hash, $package.Name, $package.Length
          if ($entry -ine $expected) { throw 'RELEASES hash or size does not match update package' }
          if ((Get-Item "$releaseDir/OMI-Instalar.exe").Length -lt 1000000) { throw 'Installer is missing or incomplete' }
          if ((Get-Item 'app/out-omi/make/zip/win32/x64/OMI-win32-x64-0.1.19.zip').Length -lt 1000000) { throw 'Portable ZIP is missing or incomplete' }

      - name: Publish complete update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases' }
          if ($releases | Where-Object tag_name -eq 'v0.1.19') { throw 'Release v0.1.19 already exists; inspect before replacing it' }
          gh release create v0.1.19 --repo $env:GITHUB_REPOSITORY --draft --title 'OMI 0.1.19' --notes 'Ordena la cabecera de la barra lateral y separa la marca OMI de la identidad de la organización.'
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          gh release upload v0.1.19 app/out-omi/make/squirrel.windows/x64/OMI-Instalar.exe app/out-omi/make/squirrel.windows/x64/RELEASES app/out-omi/make/squirrel.windows/x64/OMI-0.1.19-full.nupkg --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload all release assets' }
          $release = gh release view v0.1.19 --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets' }
          foreach ($name in @('OMI-Instalar.exe', 'RELEASES', 'OMI-0.1.19-full.nupkg')) {
            if (-not ($release.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })) { throw "Missing uploaded asset: $name" }
          }
          gh release edit v0.1.19 --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OMI-Windows-0.1.19
          path: app/out-omi/make/**
          if-no-files-found: ignore
          retention-days: 7

